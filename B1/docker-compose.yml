version: "3.8"

# B1.1 — Graph Database Setup: Neo4j (community edition) + plugin APOC
# (APOC cần cho vài hàm tiện ích: string similarity dùng cho Entity Deduplication B1.3,
#  và các thủ tục quản trị graph khác).
#
# Chạy: docker compose up -d
# Neo4j Browser (xem graph trực quan): http://localhost:7474
# Bolt (Python driver kết nối vào đây): bolt://localhost:7687
# User/pass mặc định: neo4j / highlands123 (đổi lại nếu muốn, nhớ sửa luôn trong
# graph_schema.py / ingest.py / hybrid_search.py cho khớp).

services:
  neo4j:
    image: neo4j:5.24-community
    container_name: highlands-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/highlands123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neo4j_data:
  neo4j_logs: